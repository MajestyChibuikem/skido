services:
  - type: web
    name: agrocare-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt -r requirements-ml.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --timeout 900 --workers 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
